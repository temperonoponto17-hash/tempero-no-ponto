<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tempero no Ponto - Take Away</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

:root {
  --vermelho: #e63946;
  --laranja: #f4a261;
  --amarelo: #ffbe0b;
  --preto: #222;
  --branco: #fff;
}

body {
  background: #fff8f0;
  color: var(--preto);
}

header {
  background: linear-gradient(135deg, var(--vermelho), var(--laranja));
  color: white;
  text-align: center;
  padding: 25px;
}

header h1 {
  font-size: 2.5rem;
}

section {
  padding: 40px;
  text-align: center;
}

footer {
  background: var(--preto);
  color: white;
  text-align: center;
  padding: 15px;
}
</style>

</head>

<body>

<header>
  <h1>🍽️ Tempero no Ponto</h1>
  <p>O melhor Take Away da cidade</p>
</header>

<section>
  <h2>Sobre Nós</h2>
  <p>Comida caseira feita com amor e sabor.</p>
</section>

<footer>
  <p>© 2026 Tempero no Ponto - Todos os direitos reservados</p>
</footer>

</body>
</html>
