* {
  margin: 0;
  padding: 0;

}

:root {
  --vermelho: #e63946;
  --laranja: #f4a261;
  --amarelo: #ffbe0b;
  --preto: #222;
  --branco: #fff;
}

  color: var(--preto);
}

  background: linear-gradient(135deg, var(--vermelho), var(--laranja));

  padding: 25px;
}
